# CI: build and test on pushes and pull requests. Engine jars come from the
# published OIE distribution (locally, scripts/install-engine-jars.sh installs
# the same jars from an engine checkout).

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  OIE_TAG: v4.6.0-rc1
  OIE_TARBALL: oie_unix_4_6_0-rc1.tar.gz
  MC_VERSION: '4.6.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache OIE distribution
        id: oie-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OIE_TARBALL }}
          key: oie-dist-${{ env.OIE_TAG }}

      - name: Download OIE distribution
        if: steps.oie-cache.outputs.cache-hit != 'true'
        run: curl -fSL -o "$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"

      - name: Install engine jars into the local Maven repo
        run: |
          tar xzf "$OIE_TARBALL" \
            oie/server-lib/mirth-server.jar \
            oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-model.jar \
            oie/client-lib/mirth-client.jar
          for pair in \
            "mirth-server:oie/server-lib/mirth-server.jar" \
            "mirth-client-core:oie/server-lib/mirth-client-core.jar" \
            "donkey-model:oie/server-lib/donkey/donkey-model.jar" \
            "mirth-client:oie/client-lib/mirth-client.jar"; do
            a="${pair%%:*}"; p="${pair#*:}"
            mvn -q install:install-file -Dfile="$p" -DgroupId=com.mirth.connect -DartifactId="$a" -Dversion="$MC_VERSION" -Dpackaging=jar
          done

      - name: Build
        run: mvn -B -ntp package

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: thread-viewer
          path: package/target/thread-viewer-*.zip
